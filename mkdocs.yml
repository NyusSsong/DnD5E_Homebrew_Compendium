site_name: DnD 5E Homebrew Compendium
site_description: Homebrew classes and subclasses for 5E
site_author: Song
repo_url: https://github.com/NyusSsong/DnD5E_Homebrew_Compendium
edit_uri: edit/master/docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - tables.responsive

nav:
  - Home: index.md
  - Rules: rules.md
  - Classes:
      - Base Classes:
        - Barbarian: classes/base_classes/barbarian.md
        - Bard: classes/base_classes/bard.md
        - Cleric: classes/base_classes/cleric.md
        - Druid: classes/base_classes/druid.md
        - Fighter: classes/base_classes/fighter.md
        - Monk: classes/base_classes/monk.md
        - Paladin: classes/base_classes/paladin.md
        - Ranger: classes/base_classes/ranger.md
        - Rogue: classes/base_classes/rogue.md
        - Sorcerer: classes/base_classes/sorcerer.md
        - Warlock: classes/base_classes/warlock.md
        - Wizard: classes/base_classes/wizard.md
      - 2CGaming:
        - Elementalist: classes/2cgaming/elementalist.md
      - Colville:
        - Illrigger: classes/colville/illrigger.md
      - Kibbles Tasty:
        - Inventor: classes/kibbles/kt_inventor.md
        - Occultist: classes/kibbles/kt_occultist.md
        - Psion: classes/kibbles/kt_psion.md
        - Warden: classes/kibbles/kt_warden.md
        - Warlord: classes/kibbles/kt_warlord.md
      - Laserllama:
        - Blood Hunter: classes/laserllama/ll_bloodhunter.md
        - Magus: classes/laserllama/ll_magus.md
        - Psion: classes/laserllama/ll_psion.md
        - Savant: classes/laserllama/ll_savant.md
        - Shaman: classes/laserllama/ll_shaman.md
        - Vessel: classes/laserllama/ll_vessel.md
      - Valda:
        - Alchemist: classes/valda/valda_alchemist.md
        - Captain: classes/valda/valda_captain.md
        - Craftsman: classes/valda/valda_craftsman.md
        - Investigator: classes/valda/valda_investigator.md
        - Martyr: classes/valda/valda_martyr.md
        - Warden: classes/valda/valda_warden.md
  - Magic Items: magic-items.md

markdown_extensions:
  - admonition
  - pymdownx.snippets:
      base_path: docs/snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - tables
  - toc:
      toc_depth: 0

extra_css:
  - assets/css/custom.css
  - assets/css/magic-items.css
  - assets/css/admonition-combat.css
  - assets/css/admonition-entity.css
  - assets/css/admonition-campaign.css
  - assets/css/admonition-creature.css
extra_javascript:
  - assets/js/filter.js
  - assets/js/magic-items.js
